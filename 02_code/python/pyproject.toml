[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoamp"
version = "0.0.0"
description = "Nanopore PCR amplicon haplotype analysis (Python implementation, placeholder)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nanoamp = "nanoamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
